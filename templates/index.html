<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Movie Review AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../static/styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="hero" aria-labelledby="page-title">
        <div class="hero-copy">
          <p class="eyebrow">Sentiment analysis</p>
          <h1 id="page-title">Movie Review AI</h1>
          <p class="lede">
            Paste a review and get an instant sentiment prediction from a TensorFlow model trained on IMDB reviews.
          </p>
        </div>
        <div class="score-panel" aria-live="polite">
          <span class="score-label">Current sentiment</span>
          <strong id="resultLabel">Waiting</strong>
          <div class="meter" aria-hidden="true">
            <span id="meterFill"></span>
          </div>
          <span id="resultDetail">Submit a review to analyze it.</span>
        </div>
      </section>

      <section class="workspace" aria-label="Review analyzer">
        <form id="reviewForm" class="analyzer">
          <label for="reviewText">Movie review</label>
          <textarea
            id="reviewText"
            name="review"
            rows="9"
            placeholder="Example: The movie had warm performances, sharp pacing, and a finale that actually earned its emotion."
          ></textarea>
          <div class="form-meta">
            <span id="charCount">0 characters</span>
            <span>Realtime UI, Flask prediction</span>
          </div>
          <div class="actions">
            <button type="submit" id="submitButton">Analyze Review</button>
            <button type="button" id="clearButton" class="secondary">Clear</button>
          </div>
          <p id="message" class="message" role="status"></p>
        </form>

        <aside class="examples" aria-label="Sample reviews">
          <h2>Try a sample</h2>
          <button type="button" data-review="A confident, moving film with excellent acting and a story that stays with you.">
            Positive sample
          </button>
          <button type="button" data-review="The plot was dull, the jokes missed, and the ending felt completely unfinished.">
            Negative sample
          </button>
        </aside>
      </section>
    </main>

    <script src="../static/app.js"></script>
  </body>
</html>
